name: Check feeds

# One-off check of candidate news feeds and the sites' terms pages.
# Runs on demand, or when the checker itself changes on any branch.
on:
  workflow_dispatch:
  push:
    paths: ["scripts/check_feeds.py", ".github/workflows/check-feeds.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_feeds.py
      - uses: actions/upload-artifact@v4
        with:
          name: feed-check
          path: site-check/feeds.json
